[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-mas"
version = "0.1.0"
description = "Controlled topology experiments for utility and robustness in LLM multi-agent systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Topology MAS contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
topology-mas-mutate = "topology_mas.mutation.cli:main"
topology-mas-mutate-batch = "topology_mas.mutation.batch_cli:main"
topology-mas-audit-mutations = "topology_mas.mutation.audit_cli:main"
topology-mas-prepare-gsm8k = "topology_mas.data.prepare_gsm8k:main"
topology-mas-sample-graphs = "topology_mas.topology.cli:main"
topology-mas-generate-round-zero = "topology_mas.execution.round_zero_cli:main"
topology-mas-run-batch = "topology_mas.execution.batch_cli:main"
topology-mas-analyze-batch = "topology_mas.analysis.cli:main"
topology-mas-probe-server = "topology_mas.execution.server_probe_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
analysis = [
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
